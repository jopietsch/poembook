[project]
name = "poembook"
version = "0.3.0"
description = "Build and practice a curated, copyright-aware poetry anthology"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "lxml>=5", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poembook = "poembook_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
